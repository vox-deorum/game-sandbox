# Shared upstream forwarding for both HTTPS listeners. Included inside a location block that
# has already set $app_upstream. Lives outside conf.d/ because proxy_pass is invalid at the
# http level where conf.d files are included.
proxy_pass http://$app_upstream;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-For "";
proxy_set_header X-Real-IP "";
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 24h;
proxy_send_timeout 24h;
