[project]
name = "game-sandbox"
version = "0.0.0"
description = "Game Sandbox monorepo workspace root."
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = ["harness"]

[tool.uv.sources]
game-sandbox-harness = { workspace = true }

[dependency-groups]
dev = [
    "game-sandbox-harness",
    "ruff>=0.6",
    "pytest>=8",
    "pyright>=1.1.380",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["harness/src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["harness/src", "scripts"]
# The contracts package is where types pay for themselves, so it is basic repo-wide
# and strict on harness/src.
strict = ["harness/src"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["harness/tests", "scripts/tests"]
