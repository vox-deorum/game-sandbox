site_name: Game Sandbox
site_description: A classwise playground for Game AI.
# Placeholder until the docs site is public (the Pages deploy in .github/workflows/docs.yml is
# still disabled). scripts/compose.py reads this value and substitutes the {{DOCS_URL}} token in
# composed templates, so a student's cloned template links back to the published docs. Update
# this when the real site URL is known and the token resolves to the new address automatically.
site_url: https://vox-deorum.github.io/game-sandbox/
repo_url: https://github.com/vox-deorum/game-sandbox
repo_name: vox-deorum/game-sandbox
docs_dir: docs
exclude_docs: |
  AGENTS.md
  CLAUDE.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

# The nav mirrors the "read in this order" progression on each section's index page, so the
# sidebar presents pages in learning order rather than alphabetically. The validation setting
# below makes a page that is missing from this list fail the strict docs build, so add new
# public pages here. AGENTS.md and CLAUDE.md are excluded because they contain authoring
# instructions.
validation:
  nav:
    omitted_files: warn

nav:
  - Home: index.md
  - Students:
      - students/index.md
      - students/getting-started.md
      - Environments:
          - students/environments/index.md
          - students/environments/flappy-bird.md
          - students/environments/hearts.md
          - students/environments/spades.md
      - students/agent-interface.md
      - students/llm.md
      - students/submitting.md
  - Contributors:
      - contributors/index.md
      - contributors/development-setup.md
      - contributors/configuration.md
      - contributors/test.md
      - contributors/e2e-tests.md
      - contributors/state-schema.md
      - contributors/recordings.md
      - contributors/backend.md
      - contributors/execution.md
      - contributors/frontend.md
      - contributors/design.md
      - contributors/template.md
      - Adding an environment:
          - contributors/environments/index.md
          - contributors/environments/package.md
          - contributors/environments/rendering.md
          - contributors/environments/template-and-examples.md
  - Specification:
      - specs/index.md
      - specs/overview.md
      - specs/environment.md
      - specs/interaction.md
      - specs/submission.md
      - specs/communication.md
      - specs/llm.md
      - specs/frontend.md
      - specs/leaderboard.md
      - specs/execution.md
      - specs/recording.md
