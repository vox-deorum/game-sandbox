site_name: Game Sandbox
site_description: A classwise playground for Game AI.
# Placeholder until the docs site is public (the Pages deploy in .github/workflows/docs.yml is
# still disabled). scripts/compose.py reads this value and substitutes the {{DOCS_URL}} token in
# composed templates, so a student's cloned template links back to the published docs. Update
# this when the real site URL is known and the token resolves to the new address automatically.
site_url: https://vox-deorum.github.io/game-sandbox/
repo_url: https://github.com/vox-deorum/game-sandbox
repo_name: vox-deorum/game-sandbox
docs_dir: docs
exclude_docs: |
  AGENTS.md
  CLAUDE.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

hooks:
  - scripts/mkdocs_environment_guides.py

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

# The nav mirrors the "read in this order" progression on each section's index page, so the
# sidebar presents pages in learning order rather than alphabetically. The environment-guide
# hook discovers canonical environment guides as virtual student pages, so do not list each
# environment here. AGENTS.md and CLAUDE.md are excluded because they contain authoring
# instructions.
validation:
  nav:
    omitted_files: warn

nav:
  - Home: index.md
  - Students:
      - students/index.md
      - students/getting-started.md
      - Environments:
          - students/environments/index.md
      - students/agent-interface.md
      - students/llm.md
      - students/submitting.md
  - Contributors:
      - contributors/index.md
      - Setup:
          - Development setup: contributors/setup/development.md
          - Configuration: contributors/setup/configuration.md
          - Run the app in Docker: contributors/setup/docker.md
      - Testing:
          - Testing: contributors/testing/index.md
          - Browser end-to-end tests: contributors/testing/browser-e2e.md
      - Data:
          - State schema: contributors/data/state-schema.md
          - Recordings: contributors/data/recordings.md
      - Runtime:
          - Backend: contributors/runtime/backend.md
          - Execution boundary: contributors/runtime/execution.md
      - Frontend:
          - Development: contributors/frontend/development.md
          - Design system: contributors/frontend/design-system.md
      - Environments:
          - Adding an environment: contributors/environments/index.md
          - Environment package: contributors/environments/package.md
          - Rendering: contributors/environments/rendering.md
          - Template and examples: contributors/environments/template-and-examples.md
          - Template product and releases: contributors/environments/templates.md
  - Specification:
      - specs/index.md
      - specs/overview.md
      - specs/environment.md
      - specs/interaction.md
      - specs/seasons.md
      - specs/submission.md
      - specs/communication.md
      - specs/llm.md
      - specs/frontend.md
      - specs/identity.md
      - specs/leaderboard.md
      - specs/execution.md
      - specs/deployment.md
      - specs/recording.md
