site_name: Game Sandbox
site_description: A classwise playground for Game AI.
repo_url: https://github.com/vox-deorum/game-sandbox
repo_name: vox-deorum/game-sandbox
docs_dir: docs
exclude_docs: |
  AGENTS.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

# No explicit nav: the tree under docs/ drives the tabs, so a new public page appears
# automatically. AGENTS.md is excluded because it contains authoring instructions.
