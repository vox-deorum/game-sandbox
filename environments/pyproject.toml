[project]
name = "game-sandbox-environments"
version = "0.1.0"
description = "Game Sandbox environments: the single-agent compatibility wrapper and the Flappy Bird environment."
requires-python = ">=3.12,<3.13"
# Kept in step with the template's compiled dependency set (template-v1), so the workspace
# and a student's clone run the environment code on identical library versions.
dependencies = [
    "game-sandbox-harness",
    "pettingzoo>=1.26,<1.27",
    "gymnasium>=1.3,<2.0",
    "numpy>=2,<3",
]

# Environments register themselves under this group, name = env id. The harness discovers
# them through importlib.metadata without ever importing this package.
[project.entry-points."game_sandbox.environments"]
# BEGIN GENERATED ENTRY POINTS
flappy_bird = "flappy_bird:ENTRY"
hearts = "hearts:ENTRY"
spades = "spades:ENTRY"
# END GENERATED ENTRY POINTS

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Each environment is its own top-level package under src/. This block is regenerated so the wheel
# keeps ignored shared helper packages such as `local_play` alongside recognized environments.
# BEGIN GENERATED WHEEL PACKAGES
packages = ["src/flappy_bird", "src/hearts", "src/local_play", "src/spades"]
# END GENERATED WHEEL PACKAGES
artifacts = ["src/flappy_bird/UPSTREAM_LICENSE.md"]
exclude = ["src/*/renderer", "src/*/tests"]
