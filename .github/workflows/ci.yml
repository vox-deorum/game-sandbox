name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python scripts/ci.py python

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # ci.py's typescript job only shells out to npm, so the runner's python3 is enough.
      - run: python3 scripts/ci.py typescript

  generated-code-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync
      - run: npm ci
      - run: uv run python scripts/ci.py generated-code-fresh

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python scripts/ci.py examples

  backend-integration:
    # The Docker daemon is available on ubuntu-latest, so the gated backend suite can build the
    # session base image and launch real containers. It builds the image entirely inside Docker
    # from the repo sources, so the host only needs Node and Docker — no Python toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/ci.py backend-integration

  frontend-e2e:
    # Playwright drives Chromium against the real backend serving the built frontend; starting a
    # session launches a real container, so it needs the Docker daemon (available on ubuntu-latest).
    # ci.py builds the frontend, builds the session base image inside Docker, installs Chromium, and
    # runs the suite, so the host needs only Node and Docker — no Python toolchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python3 scripts/ci.py frontend-e2e
