name: Docs

on:
  pull_request:
    paths:
      - docs/**
      - environments/*/environment.md
      - mkdocs.yml
      - scripts/_environment_guides.py
      - scripts/mkdocs_environment_guides.py
      - scripts/_paths.py
      - specs/**
  push:
    branches: [main]

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # On pull requests: build strictly so broken links and bad references fail the PR.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --group docs mkdocs build --strict
